[project]
name = "glanos-anonymization"
version = "0.1.0"
description = "Glanos Anonymization Python Library"
license = "LicenseRef-Proprietary"
readme = "README.md"

requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=1.3.13",
    "markitdown[docx,pdf,pptx,xlsx]>=0.1.6",
    "pydantic>=2.13.4",
]

[project.scripts]
glanos-anonymization = "glanos_anonymization.cli:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langchain-openai>=1.3.5",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-dotenv>=0.5.2",
    "ruff>=0.15.18",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -q"
markers = [
    "unit: fast, isolated tests - no network, no real API calls",
    "integration: tests exercising multiple components together, HTTP mocked via httpx.MockTransport",
    "e2e: tests against the real Glanos API - require GLANOS_TOKEN/GLANOS_BASE_URL to be set (e.g. via .env)",
]
