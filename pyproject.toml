[project]
name = "glanos-anonymization"
version = "2.24"
description = "Glanos anonymization.ai Python Library"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"

requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
text-extraction = [
    "markitdown[docx,pdf,pptx,xlsx]>=0.1.6",
]
langchain = [
    "langchain>=1.3.13",
]

[project.scripts]
glanos-anonymization = "glanos_anonymization.cli:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langchain>=1.3.13",
    "langchain-openai>=1.3.5",
    "markitdown[docx,pdf,pptx,xlsx]>=0.1.6",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-dotenv>=0.5.2",
    "ruff>=0.15.18",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# tests/manual: slow tests against the real API that someone watches (and may
# act in the dashboard); they run only when named, e.g. pytest tests/manual/...
norecursedirs = ["tests/manual"]
addopts = "-ra -q"
markers = [
    "unit: fast, isolated tests - no network, no real API calls",
    "integration: tests exercising multiple components together, HTTP mocked via httpx.MockTransport",
    "e2e: tests against the real Glanos anonymization.ai API - require GLANOS_TOKEN/GLANOS_BASE_URL to be set (e.g. via .env)",
]
